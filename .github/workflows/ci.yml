name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, types, tests, contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: client_ledger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ledger:ledger@localhost:5432/client_ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + integration tests (100% coverage enforced)
        run: npm run test:coverage
      - name: OpenAPI document is up to date
        run: |
          npm run openapi:export
          git diff --exit-code -- openapi.json || (echo "::error::openapi.json is stale — run 'npm run api:sync' and commit." && exit 1)
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web · lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types match the API contract
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts || (echo "::error::API types are stale — run 'npm run api:sync' and commit." && exit 1)
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (100% coverage enforced)
        run: npm run test:coverage
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci-only-password/; s/^ADMIN_PASSWORD=$/ADMIN_PASSWORD=ci-only-admin-password/' .env
      - run: docker compose build
      - name: Full stack smoke test
        run: |
          docker compose up -d --wait
          node --env-file=.env scripts/smoke-test.mjs
      - if: failure()
        run: docker compose logs
